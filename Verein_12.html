
<html>
<head>
<meta charset="utf-8">
<title>Verein_12</title>
<style>
body { font-family: Arial; font-size: 10px; background:#f4f6f9; margin:18px; color:#222; }
h1 { margin-bottom:6px; color:#1a3d7c; }
summary { position: relative; cursor: pointer; font-size: 11px; padding: 3px 6px; background: #e8eef7;
          border: 1px solid #1a3d7c; border-radius: 3px; margin-bottom: 4px; list-style: none;
          width: 100%; max-width: 650px; box-sizing: border-box; }
summary::marker { display:none; }
summary::before { content:"▶"; font-size:10px; margin-right:5px; color:#1a3d7c; }
details[open] summary::before { content:"▼"; }
details { margin-bottom:3px; }
.summary-right { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
                 display: flex; flex-direction: row; align-items: center; gap: 6px;
                 min-width: 90px; justify-content: flex-end; }
.details-btn { background: orange; color: black; padding: 1px 4px; font-size: 10px;
               border-radius: 3px; text-decoration: none; font-weight: bold; white-space: nowrap; }
.liga-icon { width: 12px; height: 8px; border-radius: 2px; }
.liga-icon.green  { background:#2ecc71; }
.liga-icon.yellow { background:#f1c40f; }
.liga-icon.red    { background:#e74c3c; }
h3 { font-size:11px; margin:5px 0 3px 0; color:#1a3d7c; }
table { border-collapse:collapse; margin-bottom:6px; background:white; border-radius:2px;
        overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,0.06); font-size:10px; white-space:nowrap; }
th { background:#1a3d7c; color:white; padding:2px 4px; }
td { padding:2px 4px; border-bottom:1px solid #e0e0e0; }
tr:nth-child(even) { background:#f0f4fa; }
hr.short { width:240px; border:0; border-top:2px solid #1a3d7c; margin:6px 0 4px 0; }
button { padding:2px 7px; background:#1a3d7c; color:white; border:none; border-radius:3px;
         margin-right:5px; font-size:10px; }
button:hover { background:#163568; }
p.ligalink { margin:3px 0 3px 0; }
</style>
<script>
function openAll(){ document.querySelectorAll("details").forEach(d=>d.setAttribute("open","")); }
function closeAll(){ document.querySelectorAll("details").forEach(d=>d.removeAttribute("open")); }
</script>
</head>
<body>

<h1>Verein_12 – Stand: 22.08.26 12:24:45</h1>


<details id='wasfindeichhier'>
<summary><b>Was finde ich hier</b> (ausklappbar)</summary>
<div style='margin-left:15px;'>
<p>Übersicht über die Ligen dieses Vereins.</p>
<p>Ergebnisse der letzten 8 Tage, aktuelle Tabelle und kommende Spiele.</p>
</div>
</details>


<div style="margin-bottom:8px;">
    <button onclick="openAll()">Alle öffnen</button>
    <button onclick="closeAll()">Alle schließen</button>
</div>



</body>
</html>
